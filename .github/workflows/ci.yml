name: CI

# Tests on every push/PR. Everything runs against the deterministic mock
# provider and the in-memory ledger -- no API keys, no AWS, no spend.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
